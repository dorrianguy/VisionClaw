name: Build SiberiusClaw IPA

on:
  push:
    branches: [ build-ipa ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generate Secrets.swift
        run: |
          cat > samples/CameraAccess/CameraAccess/Secrets.swift << SWIFT
          import Foundation
          enum Secrets {
            static let geminiAPIKey = "${{ secrets.GEMINI_API_KEY }}"
            static let openClawHost = "http://172.20.10.8"
            static let openClawPort = 3000
            static let openClawHookToken = "dev-key"
            static let openClawGatewayToken = "dev-key"
            static let webrtcSignalingURL = "ws://172.20.10.8:8080"
          }
          SWIFT

      - name: List available Xcode versions
        run: ls /Applications/ | grep Xcode

      - name: Select latest Xcode
        run: |
          # MWDATCore.framework requires Swift 6.2+ (Xcode 16.3+)
          # Try newest first
          for ver in 16.4 16.3 16.2 16.1 16.0; do
            APP="/Applications/Xcode_${ver}.app"
            if [ -d "$APP" ]; then
              echo "Selected Xcode ${ver}"
              sudo xcode-select -s "$APP/Contents/Developer"
              break
            fi
          done
          # Fallback
          if ! xcodebuild -version 2>/dev/null; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi

      - name: Show Xcode and SDK info
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build CameraAccess
        working-directory: samples/CameraAccess
        run: |
          # Get the latest iphoneos SDK
          SDK=$(xcodebuild -showsdks | grep 'iphoneos' | tail -1 | awk '{print $NF}')
          echo "Using SDK: $SDK"

          xcodebuild clean build \
            -project CameraAccess.xcodeproj \
            -scheme CameraAccess \
            -configuration Release \
            -sdk "$SDK" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            IPHONEOS_DEPLOYMENT_TARGET=17.0 \
            SWIFT_STRICT_CONCURRENCY=minimal \
            | tee /tmp/build_output.txt || true

          echo "---"
          echo "Build exit code: ${PIPESTATUS[0]}"

          # Check if the executable was created despite warnings
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "CameraAccess.app" -path "*/Release-iphoneos/*" 2>/dev/null | head -1)
          if [ -n "$APP_PATH" ] && [ -f "$APP_PATH/CameraAccess" ]; then
            echo "SUCCESS: Executable found at $APP_PATH/CameraAccess"
          else
            echo "FAIL: No executable found"
            echo "Last 30 lines of build output:"
            tail -30 /tmp/build_output.txt
            grep -i "error:" /tmp/build_output.txt | head -20
            exit 1
          fi

      - name: Find and verify app
        id: find_app
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "CameraAccess.app" -path "*/Release-iphoneos/*" 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "CameraAccess.app" 2>/dev/null | head -1)
          fi
          echo "app_path=$APP_PATH" >> $GITHUB_OUTPUT
          echo "Found app at: $APP_PATH"
          ls -la "$APP_PATH/"
          file "$APP_PATH/CameraAccess"

      - name: Create IPA
        run: |
          APP_PATH="${{ steps.find_app.outputs.app_path }}"
          rm -rf /tmp/Payload /tmp/SiberiusClaw.ipa
          mkdir -p /tmp/Payload
          cp -r "$APP_PATH" /tmp/Payload/
          cd /tmp
          zip -r SiberiusClaw.ipa Payload
          ls -la SiberiusClaw.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SiberiusClaw
          path: /tmp/SiberiusClaw.ipa
          retention-days: 7
